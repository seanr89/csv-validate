name: Build & Test

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  dotnet-build:
    name: .NET Validator
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore validator/validator.csproj

      - name: Build
        run: dotnet build validator/validator.csproj --configuration Release --no-restore

      - name: Run tests
        run: dotnet test validator.Tests/validator.Tests.csproj --no-restore --verbosity normal

  rust-client-macos:
    name: Rust Client & macOS Bundle
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Build .NET Validator Engine
        run: dotnet build validator/validator.csproj --configuration Debug

      - name: Rust Formatting & Clippy
        run: |
          cargo fmt --manifest-path client/Cargo.toml -- --check
          cargo clippy --manifest-path client/Cargo.toml --all-targets -- -D warnings

      - name: Run Rust Client Tests
        run: cargo test --manifest-path client/Cargo.toml

      - name: Bundle macOS App
        run: ./client/scripts/bundle-macos.sh
